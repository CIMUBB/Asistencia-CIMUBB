{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block header %}
<header>
    <h1>Asistencia CIM</h1>
</header>
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Por favor, ingresa tus credenciales</p>
            </div>
            <form method="post" action="/login" enctype="application/x-www-form-urlencoded" class="login-form">
                <div class="login-input-group">
                    <label for="username">Rut (sin puntos y con guion)</label>
                    <input type="text" id="username" name="username" placeholder="Ej: 12345678-9" required>
                </div>
                <div class="login-input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                {% if error %}
                <p class="login-error-message">{{ error }}</p>
                {% endif %}
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
