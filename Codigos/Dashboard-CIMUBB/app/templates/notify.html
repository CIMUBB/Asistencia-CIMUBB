<button id="notify-button" class="notify-btn">
    <i class="fas fa-bell"></i>
    <span id="notify-count" class="notify-count">0</span>
</button>
<div id="notify-box" class="notify-box hidden">
    <div class="notify-header">
        <h3>Últimos Registros</h3>
        <button id="close-notify" class="notify-close">✕</button>
    </div>
    <ul id="notify-list">
        <li class="notify-item">No hay registros recientes</li>
    </ul>
</div>
<script src="/static/js/notify.js"></script>
