{% extends "base.html" %}
{% block title %}Registrar usuario{% endblock %}
{% block content %}
{% include "navbar.html" %}
<div class="register-page">
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>Registrando</h1>
                <p>Por favor, ingrese los datos</p>
            </div>
            <form method="post" action="/register-user" enctype="multipart/form-data" class="register-form" onsubmit="return validateForm()">
                <div class="register-input-group">
                    <label for="rut">Rut (sin puntos y con guion)</label>
                    <input type="text" id="rut" name="rut" placeholder="Ej: 12345678-9" required>
                </div>

                <div class="register-input-group">
                    <label for="nombre_completo">Nombre Completo</label>
                    <input type="text" id="nombre_completo" name="nombre_completo" placeholder="Nombre Apellido">
                </div>

                <div class="register-input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com">
                </div>
                <div class="register-input-group">
                    <label for="photo">Foto de perfil (solo JPG/PNG, máx. 2MB)</label>
                    <input type="file" id="photo" name="photo" accept="image/png, image/jpeg" onchange="validateImage()">
                    <p id="photo-error" class="register-error-message" style="display:none; color:red;"></p>
                </div>
                {% if error %}
                <p class="register-error-message" style="color:red;">{{ error }}</p>
                {% endif %}
                <button type="submit" class="btn-save">Guardar</button>
            </form>

        </div>
    </div>
</div>

<script>
function validateImage() {
    const fileInput = document.getElementById("photo");
    const errorMsg = document.getElementById("photo-error");
    const allowedTypes = ["image/jpeg", "image/png"];
    const maxSize = 2 * 1024 * 1024; // 2MB

    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];

        if (!allowedTypes.includes(file.type)) {
            errorMsg.textContent = "Formato inválido. Solo se permiten imágenes JPG o PNG.";
            errorMsg.style.display = "block";
            fileInput.value = "";
            return false;
        }

        if (file.size > maxSize) {
            errorMsg.textContent = "El archivo es demasiado grande. Máximo permitido: 2MB.";
            errorMsg.style.display = "block";
            fileInput.value = "";
            return false;
        }

        errorMsg.style.display = "none";
    }
    return true;
}
function validateForm() {
    return validateImage();
}
</script>
{% endblock %}
